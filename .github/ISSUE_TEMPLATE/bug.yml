name: Bug report
description: Report a reproducible problem in LiteBox
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LiteBox version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not include secrets, private keys, or production hostnames.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
